<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOXING CAMBO TOPUP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', sans-serif, Arial;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            overflow: hidden;
        }
        /* Header Title */
        .app-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #111;
        }
        /* Main Banner Box */
        .main-banner {
            width: 100%;
            height: 150px;
            background: #e2e8f0;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
        }
        /* Sub Banner Line */
        .sub-banner-line {
            width: 100%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        /* Section Title */
        .section-title {
            font-size: 16px;
            font-weight: bold;
            font-style: italic;
            margin-bottom: 12px;
            color: #222;
        }
        /* Game Topup Cards Grid */
        .grid-cards {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .card-item {
            flex: 1;
            height: 70px;
            background: #cbd5e1;
            border-radius: 12px;
        }
        /* Service Buttons */
        .service-btn {
            width: 100%;
            padding: 15px;
            background: #cbd5e1;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #1e293b;
            text-align: center;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .service-btn:active {
            background: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ក្បាលទំព័រ -->
        <div class="app-title">គំរូថ្មី</div>

        <!-- ផ្ទាំងបដាធំ (Banner) -->
        <div class="main-banner">Banner Image / Promos</div>

        <!-- ខ្សែបន្ទាត់រំលេច -->
        <div class="sub-banner-line"></div>

        <!-- ចំណងជើង Game topup -->
        <div class="section-title">Game topup</div>

        <!-- ប្រអប់ហ្គេមតូចៗ -->
        <div class="grid-cards">
            <div class="card-item"></div>
            <div class="card-item"></div>
            <div class="card-item"></div>
        </div>

        <!-- ប៊ូតុងសេវាកម្មផ្សេងៗ -->
        <button class="service-btn" onclick="alert('ចូលទៅកាន់ អាខោន Digital')">អាខោន Digital</button>
        <button class="service-btn" onclick="alert('ចូលទៅកាន់ សេវាកម្មបូសឆែក')">សេវាកម្មបូសឆែក</button>
    </div>

</body>
</html>
