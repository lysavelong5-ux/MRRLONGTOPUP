<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOXING CAMBO TOPUP</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ----------------- RGB ភ្លើងរត់ជុំវិញស៊ុមធំ ----------------- */
        .rgb-border-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 4px;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .rgb-border-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            animation: rgb-rotate 3s linear infinite;
        }

        @keyframes rgb-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ----------------- CONTAINER ខាងក្នុង ----------------- */
        .container {
            position: relative;
            background: #ffffff;
            padding: 20px;
            border-radius: 19px;
            text-align: center;
            z-index: 1;
        }

        h2 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 2px;
            color: #111;
        }
        .subtitle {
            font-size: 11px;
            color: #666;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .search-box {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 15px;
            font-size: 13px;
            color: #555;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }
        .section-title {
            text-align: left;
            font-size: 13px;
            font-weight: bold;
            color: #16a34a;
            margin-bottom: 10px;
        }
        
        /* ----------------- 3D GAME CARDS ----------------- */
        .game-grid {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 20px;
        }
        .game-card {
            flex: 1;
            background: #f8fafc;
            padding: 12px 5px;
            border-radius: 14px;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #6366f1;
            box-shadow: 0 8px 15px rgba(99, 102, 241, 0.2);
        }
        .game-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .game-name {
            font-weight: bold;
            font-size: 11px;
            color: #1e293b;
        }

        /* ----------------- 3D RGB TOUP NOW BUTTON ----------------- */
        .btn-wrapper {
            position: relative;
            border-radius: 16px;
            padding: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .btn-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, #ff0055, #7a00ff, #00ffff, #ff0055);
            animation: rgb-rotate 2.5s linear infinite;
        }
        .topup-btn {
            position: relative;
            background: #1e293b;
            color: #fff;
            padding: 12px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            border: none;
            cursor: pointer;
            z-index: 1;
            transition: 0.2s;
        }
        .topup-btn:active {
            transform: scale(0.98);
        }

        .footer {
            font-size: 9px;
            color: #888;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="rgb-border-wrapper">
        <div class="container">
            <h2>FOXING CAMBO TOPUP</h2>
            <div class="subtitle">TOUP GAME STORE 24/7</div>
            
            <div class="search-box">បញ្ចូល Username / ID ទីនេះ...</div>

            <div class="section-title">✅ ជ្រើសរើសហ្គេម 3D (Select Game)</div>

            <div class="game-grid">
                <div class="game-card">
                    <div class="game-icon">🛡️</div>
                    <div class="game-name">MOBILE</div>
                </div>
                <div class="game-card">
                    <div class="game-icon">🔥</div>
                    <div class="game-name">FREE FIRE</div>
                </div>
                <div class="game-card">
                    <div class="game-icon">🤖</div>
                    <div class="game-name">ROBLOX</div>
                </div>
            </div>

            <div class="btn-wrapper">
                <button class="topup-btn">🛒 TOUP NOW</button>
            </div>

            <div class="footer">
                <span>SEAVLONG GROUP 2026©</span>
                <span>All Right Reserved</span>
            </div>
        </div>
    </div>

</body>
</html>
