<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOXING CAMBO TOPUP</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #111;
        }
        .subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .search-box {
            background: #e2e8f0;
            padding: 10px;
            border-radius: 20px;
            font-size: 14px;
            color: #333;
            margin-bottom: 20px;
        }
        .section-title {
            text-align: left;
            font-size: 14px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 10px;
        }
        .game-grid {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }
        .game-card {
            flex: 1;
            background: #e2e8f0;
            padding: 20px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
            color: #000;
            cursor: pointer;
            transition: 0.3s;
        }
        .game-card:hover {
            background: #cbd5e1;
        }
        .topup-btn {
            background: #94a3b8;
            color: #fff;
            padding: 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            border: none;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .footer {
            font-size: 10px;
            color: #888;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>FOXING CAMBO TOPUP</h2>
        <div class="subtitle">TOUP GAME STORE 24/7</div>
        
        <div class="search-box">TEXT</div>

        <div class="section-title">✅ GAME TOPUP</div>

        <div class="game-grid">
            <div class="game-card">MOBILE</div>
            <div class="game-card">FREE FIRE</div>
            <div class="game-card">ROBLOX</div>
        </div>

        <button class="topup-btn">TOUP NOW</button>

        <div class="footer">
            <span>SEAVLONG GROUP 2026©</span>
            <span>All Right now are you going to get it</span>
        </div>
    </div>

</body>
</html>
